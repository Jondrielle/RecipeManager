[project]
name = "backend"
version = "0.1.0"
description = "Recipe Manager backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "sqlmodel>=0.0.34",
    "ruff",
    "pytest",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
]


[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
